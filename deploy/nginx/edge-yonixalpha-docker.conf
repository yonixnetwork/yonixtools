# OPTION A (while Yonix-Alpha is still running): add these server blocks to
# Yonix-Alpha's Docker Nginx (infra/nginx/nginx.conf in that repo), which owns
# host ports 80/443. Requires, in Yonix-Alpha's docker-compose for the
# reverse-proxy service:
#     extra_hosts: ["host.docker.internal:host-gateway"]
# and a certificate for yonixtools.com issued with its certbot service.
# DO NOT apply without approval: it changes the YonixAlpha stack's config.
server {
    listen 80;
    server_name yonixtools.com www.yonixtools.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://yonixtools.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name yonixtools.com www.yonixtools.com;
    ssl_certificate     /etc/letsencrypt/live/yonixtools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yonixtools.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 16k;

    if ($host = www.yonixtools.com) { return 301 https://yonixtools.com$request_uri; }

    location / {
        proxy_pass http://host.docker.internal:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }
}
