# Inner Nginx (inside the "web" container): serves the static site and proxies
# /api/ to the downloader container. Published only on 127.0.0.1:8090; TLS and
# the public domain are handled by the edge proxy (see edge-*.conf).
real_ip_header X-Real-IP;
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;

limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=admin:1m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # PWA: the service worker must always be revalidated, so updates reach visitors.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Advertising frame: the only document with an ad-friendly CSP (ad creatives come
    # from many rotating https hosts). It is meant to be served from the SEPARATE ad origin
    # (ads.yonixtools.com, see edge-ads-origin.conf), so the browser keeps the ad code away
    # from the site's pages, cookies and storage. Every other path keeps the strict
    # site-wide policy from security-headers.conf.
    location = /ad-frame.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline' https:; style-src 'unsafe-inline' https:; img-src data: blob: https:; media-src blob: https:; font-src data: https:; connect-src https:; frame-src https:; frame-ancestors 'self'; form-action https:; object-src 'none'; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    # Administrator-only area (ad delivery test page). Server-side HTTP authentication over
    # HTTPS. Fails closed: without the password file every request gets an error, never
    # the page. Create it with deploy/scripts/admin-password.sh. Never cached, never indexed.
    location ^~ /admin/ {
        limit_req zone=admin burst=20 nodelay;
        auth_basic "YoniXTools admin";
        auth_basic_user_file /etc/nginx/admin/htpasswd;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        index index.html;
        try_files $uri $uri/ =404;

        # Anonymous ad-delivery counts for the admin page (inherits the password check above).
        # Only this location sets the header the backend requires; /api/ clears it.
        location = /admin/api/ad-stats {
            proxy_pass http://$downloader_upstream/v1/ad-stats;
            proxy_set_header X-Ytx-Admin "nginx-admin-auth";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Docker's embedded DNS, re-resolved at request time so a restarted
    # downloader container (new IP) is picked up without reloading Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $downloader_upstream downloader:8787;

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        client_max_body_size 16k;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$downloader_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Ytx-Admin ""; # never let a visitor reach the admin-only stats
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        # Stream finished files straight to the client instead of buffering them to disk.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        # Never expose internal endpoints through the proxy.
        location /api/internal/ { return 404; }
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        index index.html;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
