# Ad origin for host Nginx. Installed by deploy/scripts/setup-ads-origin.sh (owner-approved). Needs:
#   DNS:  A  ads.yonixtools.com -> the droplet's IPv4 (same as yonixtools.com)
#   Cert: certbot certonly --webroot -w /var/www/certbot -d ads.yonixtools.com
# Then build with AD_ORIGIN=https://ads.yonixtools.com (deploy/docker-compose.yml).
#
# The ad origin serves the public ad frame /ad-frame.html (the publisher codes) and the
# password-protected admin test /ad-test.html, and nothing else: no site pages, no API, no service worker, no cookies of the main site
# (host-only cookies on yonixtools.com are never sent to ads.yonixtools.com).
server {
    listen 80;
    listen [::]:80;
    server_name ads.yonixtools.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://ads.yonixtools.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ads.yonixtools.com;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/ads.yonixtools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ads.yonixtools.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 1k;

    location = /ad-frame.html {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";          # nothing from the browser reaches the app
        proxy_hide_header Set-Cookie;
    }
    # Administrator-only ad test. The web container checks the admin password itself
    # (server-side HTTP auth, deploy/nginx/web.conf); the Authorization header is passed on.
    location = /ad-test.html {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location / { return 404; }
}

# The main site (yonixtools.com) can't serve the ad documents: the web container answers 404
# for /ad-frame.html and /ad-test.html on any host other than the ad origin (web.conf,
# $ytx_wrong_origin), so no change to the main site's edge block is needed.
