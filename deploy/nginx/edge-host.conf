# Edge proxy for a HOST-LEVEL Nginx (use after Yonix-Alpha's Docker Nginx no
# longer owns ports 80/443, or on a fresh server). Obtain certificates first:
#   certbot certonly --webroot -w /var/www/certbot -d yonixtools.com -d www.yonixtools.com
server {
    listen 80;
    listen [::]:80;
    server_name yonixtools.com www.yonixtools.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://yonixtools.com$request_uri; }
}

server {
    # "listen ... http2" (not "http2 on;") so this works on Ubuntu 24.04's Nginx 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yonixtools.com;
    ssl_certificate     /etc/letsencrypt/live/yonixtools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yonixtools.com/privkey.pem;
    return 301 https://yonixtools.com$request_uri;
}

server {
    # "listen ... http2" (not "http2 on;") so this works on Ubuntu 24.04's Nginx 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yonixtools.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/yonixtools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yonixtools.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:yonixtools_ssl:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }
}
