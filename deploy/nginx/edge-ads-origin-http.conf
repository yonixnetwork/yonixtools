# Phase 1 of the ad origin (HTTP only): lets certbot verify ads.yonixtools.com.
# Installed by deploy/scripts/setup-ads-origin.sh; replaced by edge-ads-origin.conf once the
# certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name ads.yonixtools.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}
