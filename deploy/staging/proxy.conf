# Staging-only gatekeeper (nginx:1.27-alpine, container yonixtools-stg-proxy).
# The Cloudflare quick tunnels reach ONLY this proxy, never the app directly.
#   127.0.0.1:8092 -> site: password (HTTP basic auth over the tunnel's HTTPS), per-visitor and
#                     total rate limits, noindex everywhere.
#   127.0.0.1:8093 -> ad-frame origin: serves /ad-frame.html only (it must load inside iframes,
#                     where a password prompt can't work; it holds only the public publisher code).

# Real visitor address: cloudflared forwards it in CF-Connecting-IP; connections arrive from the
# Docker bridge gateway.
real_ip_header CF-Connecting-IP;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;

limit_req_zone $binary_remote_addr zone=stg_pages:5m rate=120r/m;
limit_req_zone $binary_remote_addr zone=stg_api:5m rate=12r/m;       # per visitor
limit_req_zone $server_port       zone=stg_api_all:1m rate=30r/m;    # all visitors together
limit_conn_zone $binary_remote_addr zone=stg_conn:5m;
limit_req_status 429;
limit_conn_status 429;

resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS: the staging web container by name

server {
    listen 8092;
    server_tokens off;
    client_max_body_size 16k;
    limit_conn stg_conn 20;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    set $web yonixtools-stg-web:80;

    auth_basic "YoniXTools staging";
    auth_basic_user_file /etc/nginx/staging.htpasswd;

    # Never send the staging password (or anything else) on to the app.
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    location = /robots.txt { auth_basic off; default_type text/plain; add_header X-Robots-Tag "noindex, nofollow, noarchive" always; return 200 "User-agent: *\nDisallow: /\n"; }

    # PWA install check: browsers fetch the manifest and its icons WITHOUT credentials.
    # These are public, static files (no data), so they are the only unauthenticated paths.
    location = /manifest.webmanifest { auth_basic off; proxy_pass http://$web; }
    location ^~ /icons/ { auth_basic off; proxy_pass http://$web; }

    location /api/ {
        limit_req zone=stg_api burst=12 nodelay;
        limit_req zone=stg_api_all burst=20 nodelay;
        proxy_pass http://$web;
    }
    location / {
        limit_req zone=stg_pages burst=60 nodelay;
        proxy_pass http://$web;
    }
}

server {
    listen 8093;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    set $web yonixtools-stg-web:80;
    limit_req zone=stg_pages burst=60 nodelay;

    location = /ad-frame.html {
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_pass http://$web;
    }
    location = /robots.txt { default_type text/plain; add_header X-Robots-Tag "noindex, nofollow, noarchive" always; return 200 "User-agent: *\nDisallow: /\n"; }
    location / { return 404; }
}
