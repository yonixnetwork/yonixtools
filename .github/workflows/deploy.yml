# Manual, approval-gated production deploy. Never runs automatically.
# Setup (by the repository owner):
#   1. Settings → Environments → "production" → add yourself as a required reviewer.
#   2. Add environment secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key of a
#      deploy user), DEPLOY_KNOWN_HOSTS (output of `ssh-keyscan <host>`), DEPLOY_PATH.
name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DIR: ${{ secrets.DEPLOY_PATH }}
          REF: ${{ inputs.ref }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER@$HOST" bash -s -- "$DIR" "$REF" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          git fetch --quiet origin "$2"
          git checkout --quiet --detach FETCH_HEAD
          bash deploy/scripts/deploy.sh
          REMOTE
